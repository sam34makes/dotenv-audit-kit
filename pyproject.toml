[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dotenv-audit-kit"
version = "0.1.0"
description = "Catch dotenv configuration drift without printing values."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "sam34makes"}]
keywords = ["dotenv", "configuration", "cli", "ci", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
dotenv-audit = "dotenv_audit.cli:main"

[project.urls]
Homepage = "https://github.com/sam34makes/dotenv-audit-kit"
Issues = "https://github.com/sam34makes/dotenv-audit-kit/issues"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.14,<1", "mypy>=1.18,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/dotenv_audit"]
